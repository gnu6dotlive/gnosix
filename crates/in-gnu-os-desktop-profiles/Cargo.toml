[package]
name = "in-gnu-os-desktop-profiles"
version = "0.1.0"
edition = "2021"
publish = false
description = "Versioned desktop profile schema and pure resolution policy for the in.gnu.os authority"
license.workspace = true
[dev-dependencies]
serde_json = "1"

[dependencies]
gnosix-desktop-model = { path = "../gnosix-desktop-model" }
in-gnu-os-output-identity = { path = "../in-gnu-os-output-identity" }
in-gnu-os-output-identity-projection = { path = "../in-gnu-os-output-identity-projection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1.0"

[features]
r12-production-writer = []
r12-production-provisioner = []
