[package]
name = "gnos-notifications"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Native org.freedesktop.Notifications server and notification store for Gnosix"

[dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-lite = "2"
