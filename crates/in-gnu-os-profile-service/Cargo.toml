[package]
name = "in-gnu-os-profile-service"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
[[bin]]
name = "in-gnu-os-profiled"
path = "src/main.rs"
[dependencies]
in-gnu-os-desktop-profiles = { path = "../in-gnu-os-desktop-profiles", features = ["r12-production-writer", "r12-production-provisioner"] }
in-gnu-os-output-identity = { path = "../in-gnu-os-output-identity" }
in-gnu-os-caller-auth = { path = "../in-gnu-os-caller-auth" }
zbus = "5.19.0"
serde_json = "1"
uuid = { version = "1.26.1", features = ["v4"] }
signal-hook = "0.3.18"
