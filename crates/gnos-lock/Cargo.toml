[package]
name = "gnos-lock"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "The Gnosix lock screen: its settings and its state machine (LOCK-01)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The daemon's dependencies; the library (settings, state machine) needs none.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
cosmic-text = { version = "0.19", optional = true }
gnos-clock = { path = "../gnos-clock", optional = true }
pam-client = { version = "0.5", optional = true }
smithay-client-toolkit = { version = "0.20", optional = true }
tiny-skia = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"], optional = true }
wayland-client = { version = "0.31.15", features = ["system"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"], optional = true }
futures = { version = "0.3.34", optional = true }
calloop = { version = "0.14", optional = true }
calloop-wayland-source = { version = "0.4", optional = true }
gnos-i18n = { path = "../gnos-i18n", optional = true }

[features]
daemon = [
    "dep:chrono", "dep:cosmic-text", "dep:gnos-clock", "dep:pam-client",
    "dep:smithay-client-toolkit", "dep:tiny-skia", "dep:tokio", "dep:wayland-client",
    "dep:wayland-protocols", "dep:zbus", "dep:futures", "dep:calloop",
    "dep:calloop-wayland-source", "dep:gnos-i18n",
]


[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "gnos-lockd"
path = "src/bin/gnos-lockd.rs"
required-features = ["daemon"]
