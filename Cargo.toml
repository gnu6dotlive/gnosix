[workspace]
resolver = "2"
members = ["crates/gnos-ux-surface","crates/gnos-ux-gpui","crates/gnos-ux-sdk","crates/gnoshow",
    "crates/gnos-ux-product-intent",
    "crates/gnos-ux-activation-client",
    "crates/gnosix-activation-protocol",
    "crates/gnosix-desktop-model",
    "crates/gnosix-hyprland",
    "crates/in-gnu-os-output-identity",
    "crates/in-gnu-os-output-identity-projection",
    "crates/in-gnu-os-desktop-profiles",
    "crates/in-gnu-os-activation",
    "crates/in-gnu-os-settings-core",
    "crates/in-gnu-os-settings-read-model",
    "crates/gnosix-application-catalog",
    "crates/gnosix-application-launch",
    "crates/gnosix-input-core",
    "crates/in-gnu-os-caller-auth",
    "crates/in-gnu-os-profile-service",
    "crates/gnos-ux-profile-client",
    "crates/gnosix-input-observation",
    "crates/gnosix-input-runtime-observer",
    "crates/in-gnu-os-filechooser-portal",
    "xtask",
]

[workspace.package]
license = "GPL-3.0-or-later"

[patch.crates-io]
# gpui-pre-linux 0.3.5 rewrites compositor-selected layer-shell size (0) to the
# configured pixel size after the first configure. GNOS.UX needs compositor-sized
# axes to remain compositor-sized across Hyprland hot output resizes.
gpui-pre-linux = { path = "vendor/gpui-pre-linux-0.3.5" }
