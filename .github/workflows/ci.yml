# PRODUCT-TOOLING-01 Phase 5 lean CI.
#
# One workflow, one job, whose meaningful body is `cargo xtask ci`. The YAML
# exists to provision an environment and then get out of the way; the
# qualification contract itself lives in the repository, in Rust, where a
# developer and an agent run exactly the same thing locally.
#
# The alternative - reproducing the check list in YAML - is how local truth and
# CI truth drift apart. It is a second implementation of the same contract, and
# the second one is the one nobody runs locally.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. This workflow reads the repository and nothing else: no
# write token, no deployments, no package or release publishing.
permissions:
  contents: read

jobs:
  verify:
    name: xtask ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Storage and time only. Neither setting changes what a check computes or
    # how a verdict is reached, which is why they belong here rather than in
    # the check definitions: qualification semantics and build economics are
    # separate concerns and should not be entangled.
    #
    # The second main run failed with "No space left on device" partway through
    # Qualification. A cold build of this workspace produces roughly 9.3 GB of
    # cargo artifacts, of which incremental compilation state and debug info
    # are the bulk, and a hosted runner does not have much more than that to
    # give. Turning both off is a storage measure, not a semantic one: a
    # one-shot CI run gains nothing from incremental state it will never reuse,
    # and qualification results are unaffected by the absence of debug info.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      # Pinned to an immutable commit SHA, not a tag. A tag is a name that can
      # be moved; the SHA is the code that actually ran, which is the only
      # version of this worth recording in provenance.
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native build dependencies, determined from the workspace's own build
      # graph rather than from a conventional CI setup. The `*-sys` and
      # `*-sys`-adjacent crates in the graph are:
      #
      #   wayland-sys               -> wayland-client, -cursor, -egl, -server
      #   khronos-egl               -> egl
      #   xkbcommon-dl              -> dlopen'd at runtime, so the built binary
      #                                 links libxkbcommon.so.0 and nothing else
      #   freetype-sys              -> freetype2
      #   yeslogic-fontconfig-sys   -> fontconfig
      #   accesskit_unix            -> dbus-1 (via zbus)
      #   wgpu                      -> vulkan headers
      #
      # All of these are development headers, not a desktop stack. Nothing here
      # installs a compositor, a session, or a display server, and the
      # qualification never opens a window.
      #
      # This set is derived from the dependency graph, not yet confirmed by a
      # green run. That is recorded in the Phase 5 receipt as an open item
      # rather than claimed as a verified environment.
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwayland-dev \
            libegl-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libxkbcommon0 \
            libfreetype-dev \
            libfontconfig1-dev \
            libdbus-1-dev

      # The first run of this workflow failed because this step was missing
      # entirely: the runner had an empty workspace, so neither
      # .cargo/config.toml nor rust-toolchain.toml existed, `cargo xtask` was
      # an unknown command, and `rustup show active-toolchain` cheerfully
      # reported the runner's own default stable rather than the pinned
      # channel. The checkout step was added first so that the toolchain
      # resolution below has a repository to resolve against.
      - name: Provision the validated toolchain
        run: |
          set -euo pipefail
          # rust-toolchain.toml in the repository names the channel, so CI
          # cannot drift to a different compiler than the one the matrix was
          # validated on.
          rustup toolchain install

      # Assert the pin rather than trust it. The first run reported a green
      # toolchain step while running 1.98.1 against a 1.97.0 pin, because the
      # step succeeded on a runner that had no repository. A setup step that
      # cannot fail is not a setup step.
      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          running=$(rustc -V | cut -d' ' -f2)
          echo "pinned:  $pinned"
          echo "running: $running"
          if [ "$pinned" != "$running" ]; then
            echo "::error::running $running, but rust-toolchain.toml pins $pinned"
            exit 1
          fi

      - name: Report the environment
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -V
          git rev-parse HEAD
          git status --porcelain && echo "(clean tree above)"

      # Disk headroom, reported before the build rather than discovered when it
      # fails. The second run died with "No space left on device" inside the
      # Qualification step, with no artifact and no per-check log, because the
      # process was killed mid-build. An infrastructure failure that produces no
      # evidence is the hardest kind to diagnose and the easiest to misread as
      # a product regression; printing the headroom first makes the next
      # occurrence legible.
      - name: Report disk headroom
        run: |
          set -euo pipefail
          df -h / "$HOME" | sed 's/^/  /'
          echo "  CARGO_INCREMENTAL=$CARGO_INCREMENTAL"
          echo "  CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG"

      # The single meaningful step. Everything above it is environment.
      - name: Qualification
        run: cargo xtask ci

      # Artifacts are CI artifacts, not commits. CI never writes evidence back
      # to the repository: that would make the run a mutation of the thing it
      # is verifying.
      - name: Retain the qualification record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtask-qualification
          path: |
            target/xtask/summary.json
            target/xtask/provenance.json
            target/xtask/*.log
          if-no-files-found: warn
          retention-days: 14
