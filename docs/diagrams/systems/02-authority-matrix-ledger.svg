        <rect width="1000" height="38" rx="6" fill="#111418"/>
        <text x="25" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.08em">DOMAIN SUBSYSTEM</text>
