<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dia-title dia-desc" id="d-02-authority-matrix-ledger-root">
      <title id="dia-title">gnosix · Explicit Authority Ledger</title>
      <desc id="dia-desc">Mapping domain ownership vs non-implication invariants across all core subsystems.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-authority-matrix-ledger-root { --gnx-shell-white:              #F7F3ED;
      --gnx-pure-white:               #FFFFFF;
      --gnx-anthracite:               #111418;
      --gnx-slate:                    #667085;
      --gnx-muted:                    #A1A6AD;
      --gnx-hairline:                 #D7DADF;
      --gnx-quiet-divider:            #E6E8EB;
      --gnx-signal-orange:            #FF6A00;
      --gnx-signal-orange-accessible: #C95400;
      --gnx-signal-orange-tint:       #FFE5D2;
      --gnx-beret-green:              #5F7F52;
      --gnx-beret-green-accessible:   #455F3D;
      --gnx-beret-green-tint:         #E8EFE5;
      --gnx-royal-blue:               #4169E1;
      --gnx-royal-blue-accessible:    #2446A8;
      --gnx-royal-blue-tint:          #E8EDFF;
      --font-primary:                 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
      #d-02-authority-matrix-ledger-root { font-family: var(--font-primary); color: var(--gnx-anthracite); }
      #d-02-authority-matrix-ledger-root .subtitle { font-family: var(--font-primary);
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--gnx-slate);
      margin-bottom: 1.6rem; }</style>
        <pattern id="d-02-authority-matrix-ledger-grid-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" fill="#111418" fill-opacity="0.06"/>
        </pattern>
        <marker id="d-02-authority-matrix-ledger-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#667085"/>
        </marker>
        <marker id="d-02-authority-matrix-ledger-arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#FF6A00"/>
        </marker>
        <marker id="d-02-authority-matrix-ledger-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5F7F52"/>
        </marker>
        <marker id="d-02-authority-matrix-ledger-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4169E1"/>
        </marker>
