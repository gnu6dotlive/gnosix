      <rect width="1100" height="580" fill="#F7F3ED"/>
      <rect width="1100" height="580" fill="url(#d-02-authority-matrix-ledger-grid-dots)"/>


      <rect x="50" y="25" width="1000" height="42" rx="6" fill="#FFFFFF" stroke="#D7DADF" stroke-width="1"/>
      <text x="70" y="50" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#C95400" letter-spacing="0.1em">SYSTEMS &amp; AUTHORITY · VOL II · 02/14</text>
      <text x="350" y="50" font-family="'Space Grotesk', sans-serif" font-size="11.5" font-weight="400" fill="#667085">Authoritative Matrix from AUTHORITY.md</text>
      <rect x="910" y="33" width="125" height="26" rx="4" fill="#FFE5D2"/>
      <text x="922" y="50" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#111418">gnosix_DS V3.4.1</text>
    
      <g transform="translate(50, 85)">
